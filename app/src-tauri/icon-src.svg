<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Cogwait mark — flat, hard-edged, zero glow (ui-redo DESIGN.md §3.1). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1915"/>
      <stop offset="1" stop-color="#141310"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="226" fill="none" stroke="#302c24" stroke-width="4"/>
  <!-- brand-dot mark, scaled up: a notched gold block, not a glowing orb -->
  <rect x="380" y="298" width="264" height="264" rx="52" fill="#CA9A2B"/>
  <rect x="380" y="298" width="264" height="264" rx="52" fill="none" stroke="#1a1204" stroke-opacity="0.35" stroke-width="10"/>
  <!-- status line, recolored gold + blue (value / action) -->
  <rect x="288" y="640" width="448" height="46" rx="10" fill="#CA9A2B"/>
  <rect x="288" y="716" width="288" height="46" rx="10" fill="#2B5BCA"/>
</svg>
