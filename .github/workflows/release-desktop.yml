name: Release Desktop

# Builds the Cogwait desktop app. On a tag push it signs + notarizes the macOS
# bundle IF the Apple secrets are present; otherwise it produces an unsigned
# build (still runnable locally via right-click → Open).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo and upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    # Only ever run (and thus only expose signing secrets) on this repo.
    if: github.repository == 'Cognifer-Labs/cogwait'
    # Signing secrets live in the `release` environment — protect it with required
    # reviewers in repo settings so a release run needs a maintainer to approve.
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # macOS runners ship rustup + stable Rust — no third-party action needed.
      - name: Add Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install deps
        run: npm ci

      - name: Build (sign + notarize if secrets present)
        env:
          # Set these as `release`-environment secrets to sign + notarize. If unset,
          # the build is unsigned and tauri simply skips signing.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: cogwait-macos
          path: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
